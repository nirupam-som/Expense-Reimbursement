# Local development database only.
# Production uses a managed Postgres (Supabase) — see docs/architecture.md.
services:
  db:
    image: postgres:16-alpine
    container_name: expense-db
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_reimbursement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_reimbursement"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
